title: envpact
description: Centralized secrets manager for AI coding agents. Your secrets live in your own private GitHub repo; envpact reads them into project-scoped .env files, syncs them to AI agents over MCP, and rotates them across every project at once.
url: "https://envpact.oriz.in"
baseurl: ""

theme: jekyll-theme-minimal

markdown: kramdown
plugins:
  - jekyll-relative-links

relative_links:
  enabled: true
  collections: false
include:
  - index.md
  - architecture.md
  - schema.md
  - environments.md
  - security.md

kramdown:
  parse_block_html: true
